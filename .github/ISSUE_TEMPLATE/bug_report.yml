name: Bug report
description: Something on the site renders or behaves wrong.
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool?
      description: The name or URL, e.g. Dithering or /webfun/dithering
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the tool
        2. Drag the resolution slider to the far left
        3. The preview goes blank
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 18, iPhone 15 / Chrome 130, Windows 11
    validations:
      required: true
