<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    A roughly-edged ring crossed by a straight bar, offset to the right.

    The ring is a single closed path rather than a circle, so its radius can
    wobble point to point — a true circle can't be rough, and a filter that
    roughens one costs a rasterisation step at every size the icon is drawn.

    `currentColor` throughout: the tab strip is dark or light depending on the
    browser, and the `prefers-color-scheme` rule below is what lets one file
    read correctly in both.
  -->
  <style>
    :root { color: #111; }
    @media (prefers-color-scheme: dark) { :root { color: #f5f5f5; } }
  </style>

  <!-- Sits low in the frame, so the bar breaks further clear of it at the top.
       A `translate` rather than baked-into-the-path coordinates: nudging it
       again is one number, not fourteen. -->
  <path
    transform="translate(0 3.5)"
    d="M31.4 6.2
       C40.1 6.0 47.6 10.4 51.2 17.8
       C54.9 25.4 54.3 34.6 49.9 41.5
       C45.6 48.3 38.2 52.3 30.6 51.9
       C22.9 51.6 15.9 47.0 12.3 39.9
       C8.6 32.6 9.0 23.5 13.2 16.7
       C17.2 10.2 24.0 6.3 31.4 6.2
       Z"
    stroke="currentColor"
    stroke-width="3.4"
    stroke-linejoin="round"
  />

  <!--
    The ring spans roughly x 9.5 → 53.5, so 60% across its width lands at 35.9 —
    inside the ring rather than clear of it, which is what makes the two read as
    one mark instead of a circle standing next to a line.

    Deliberately lopsided: it breaks well clear of the ring at the top and only
    grazes it at the bottom. Stroke puts the ring's own outer edge at y ≈ 4.3 and
    ≈ 54.0, and the bar's round caps reach 1.7 past each end — so 1.8 tops out at
    0.1, just inside the viewBox, and 53.0 lands a hair below the ring.
  -->
  <path
    d="M40.3 2.5 L40.3 61.5"
    stroke="currentColor"
    stroke-width="3.4"
    stroke-linecap="round"
  />
</svg>
